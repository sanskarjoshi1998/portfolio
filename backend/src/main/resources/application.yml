server:
  port: 8080

spring:
  application:
    name: portfolio-app
    forward-headers-strategy: framework

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:portfolio_user}
    password: ${DB_PASSWORD:portfolio_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS} # 24 hours

  oauth2:
    # Where the backend redirects the browser after Google login completes,
    # carrying the JWT as a query param for the Angular app to pick up.
    authorized-redirect-uri: "{baseUrl}/login-success"

  admin:
    # Comma-separated list of Google account emails allowed to log in as admin.
    # Anyone else who logs in via Google will be rejected.
    allowed-emails: ${ADMIN_ALLOWED_EMAILS}
    default-username: ${ADMIN_DEFAULT_USERNAME}
    default-password: ${ADMIN_DEFAULT_PASSWORD}
    default-email: ${ADMIN_DEFAULT_EMAIL}

logging:
  level:
    org.springframework.security: INFO
    com.portfolio.app: DEBUG
    
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
