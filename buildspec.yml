version: 0.2

env:
  variables:
    # These can also be set in CodeBuild project settings instead of here
    AWS_DEFAULT_REGION: ap-south-1
    ACCOUNT_ID: 342695602587   # replace with your AWS account ID

phases:
  install:
    runtime-versions:
      java: corretto17
      nodejs: 18
    commands:
      - echo Installing Angular CLI...
      - npm install -g @angular/cli

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo Building frontend...
      - cd frontend
      - npm install
      - ng build --configuration production
      - cd ..
      - echo Building backend...
      - cd backend
      - ./mvnw clean package -DskipTests
      - cd ..

  build:
    commands:
      - echo Building Docker images...
      - docker build -t $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/frontend:latest ./frontend
      - docker build -t $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/backend:latest ./backend

  post_build:
    commands:
      - echo Pushing Docker images to ECR...
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/frontend:latest
      - docker push $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/backend:latest
      - echo Writing imagedefinitions.json for ECS deployment...
      - printf '[{"name":"frontend","imageUri":"%s"},{"name":"backend","imageUri":"%s"}]' \
        $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/frontend:latest \
        $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/backend:latest > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
