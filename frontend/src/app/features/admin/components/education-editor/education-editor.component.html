<div class="editor">
  <h2>Education</h2>

  <form (ngSubmit)="save()" class="card form-grid">
    <div>
      <label>Institution *</label>
      <input type="text" name="institution" [(ngModel)]="form.institution" required>
    </div>
    <div>
      <label>Degree</label>
      <input type="text" name="degree" [(ngModel)]="form.degree" placeholder="B.Tech">
    </div>
    <div>
      <label>Field of Study</label>
      <input type="text" name="fieldOfStudy" [(ngModel)]="form.fieldOfStudy" placeholder="Computer Science">
    </div>
    <div>
      <label>Grade</label>
      <input type="text" name="grade" [(ngModel)]="form.grade" placeholder="8.5 CGPA">
    </div>
    <div>
      <label>Start Date</label>
      <input type="date" name="startDate" [(ngModel)]="form.startDate">
    </div>
    <div>
      <label>End Date</label>
      <input type="date" name="endDate" [(ngModel)]="form.endDate">
    </div>
    <div class="full-width">
      <label>Description</label>
      <textarea name="description" [(ngModel)]="form.description" rows="3"></textarea>
    </div>

    <div class="full-width actions">
      <button type="submit" class="btn btn-primary" [disabled]="isSaving()">
        {{ editingId ? 'Update' : 'Add' }} Education
      </button>
      <button type="button" class="btn btn-outline" *ngIf="editingId" (click)="resetForm()">Cancel</button>
    </div>
  </form>

  <div class="list">
    <div class="card list-item" *ngFor="let item of items()">
      <div>
        <strong>{{ item.institution }}</strong>
        <p class="muted">{{ item.degree }} {{ item.fieldOfStudy ? '· ' + item.fieldOfStudy : '' }}</p>
        <p class="muted small">{{ item.startDate }} – {{ item.endDate || 'Present' }}</p>
      </div>
      <div class="item-actions">
        <button class="btn btn-outline" (click)="edit(item)"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-outline" (click)="remove(item.id)"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <p class="muted" *ngIf="items().length === 0">No education entries yet.</p>
  </div>
</div>
