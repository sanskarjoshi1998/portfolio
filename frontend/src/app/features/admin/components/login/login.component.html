<div class="login-page">
  <div class="login-card card">
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in to manage your portfolio</p>

    <form (ngSubmit)="submit()">
      <label for="username">Username</label>
      <input id="username" type="text" [(ngModel)]="credentials.username" name="username" required autocomplete="username" />

      <label for="password">Password</label>
      <input id="password" type="password" [(ngModel)]="credentials.password" name="password" required autocomplete="current-password" />

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px; justify-content: center;" [disabled]="isLoading()">
        @if (isLoading()) {
          Signing in...
        } @else {
          Sign in
        }
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <button type="button" class="btn btn-google" (click)="loginWithGoogle()">
      <i class="fa-brands fa-google"></i> Sign in with Google
    </button>

    <a routerLink="/" class="back-link">← Back to portfolio</a>
  </div>
</div>
